<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Patient Information</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
            integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap">
        <script src="script.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                document
                    .getElementById("pinHolder")
                    .addEventListener("click", function () {
                        this.classList.toggle("revealed");
                    });
            });
        </script>
    </head>
    <body style="font-family: Roboto; background-color: #008080;">
        <div class="form-info d-flex justify-content-center align-items-center min-vh-100">
            <div class="card p-4"
                style="width: fit-content; height: fit-content; background-color: #f4f4f4; border-radius: 10px;">
                <fieldset>
                    <legend>Patient Information</legend>
                    <hr>
                    <form id="mainform" onsubmit="FormSubmit(event)">
                        <div>
                            <span class="error" id="nameError"></span>
                            <label for="name">Name: </label>
                            <input type="text" id="name" value="" /> <br />
                        </div>
                        <hr>
                        <div>
                            <span class="error" id="addrError"></span>
                            <label for="addr">Address: </label>
                            <textarea id="addr" rows="4" cols="30"></textarea> <br />
                        </div>
                        <hr>
                        <div>
                            <span class="error" id="dobError"></span>
                            <label for="dob">Birth Date: </label>
                            <input type="date" id="dob" value="" /> <br />
                        </div>
                        <hr>
                        <div>
                            <span class="error" id="ageError"></span>
                            <label for="age">Age: </label>
                            <input type="text" id="age" value="" /> <br />
                        </div>
                        <hr>
                        <div>
                            <span class="error" id="genderError"></span>
                            <label for="gender">Gender: </label>
                            <label for="male">MALE </label>
                            <input type="radio" name="gender" id="male" value="male" />
                            <label for="female">FEMALE </label>
                            <input type="radio" name="gender" id="female" value="female" />
                            <br />
                        </div>
                        <hr>
                        <div>
                            <span class="error" id="diseaseError"></span>
                            <label for="disease">Disease: </label>
                            <select id="disease" name="disease">
                                <option value="0">Select</option>
                                <option value="1">nisi</option>
                                <option value="2">ut</option>
                                <option value="3">commodo</option>
                                <option value="4">consectetur</option>
                            </select>
                            <br />
                        </div>
                        <hr>
                        <div>
                            <span class="error" id="emailError"></span>
                            <label for="email">Email: </label>
                            <input type="email" id="email" value="" /> <br />
                        </div>
                        <hr>
                        <div>
                            <span class="error" id="pinError"></span>
                            <label for="pin">PIN: </label>
                            <input type="password" id="pin" maxlength="6" value="" /> <br />
                        </div>
                        <hr>
                        <div>
                            <input type="submit" value="Submit" />
                        </div>
                    </form>
                </fieldset>
            </div>
        </div>
        <div id="output" class="outputDiv"></div>
        <div class="outputDiv">
            <span id="pinHolder" class="blurred"></span>
        </div>
    </body>
</html>
